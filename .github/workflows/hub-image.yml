# Builds the fleet hub's Linux image and pushes it to the GitHub Container Registry when a version is tagged.
name: Hub image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Hub/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/darrickbm/utm-watch-hub:latest
            ghcr.io/darrickbm/utm-watch-hub:${{ github.ref_name }}
